name: 근무 캘린더 게시

on:
  schedule:
    # UTC 21:00 = KST 06:00. 출근 전에 그날 계획이 캘린더에 들어가 있게 한다.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # flex 약관은 플렉스의 동의 없는 자동 수집을 금지한다. 동의를 받기 전에는
    # 예약 실행을 건너뛰고 수동 실행만 한다. 동의를 받으면 저장소 변수
    # SCHEDULE_ENABLED 를 true 로 둔다.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 비밀번호를 다루는 워크플로라 외부 액션은 태그가 아니라 커밋으로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: 테스트
        run: python -m unittest discover -s tests -t .

      # 여기서 실패하면 뒤의 게시 단계가 돌지 않아 이미 게시된 파일이 그대로 남는다.
      - name: 근무 일정 받기
        env:
          FLEX_EMAIL: ${{ secrets.FLEX_EMAIL }}
          FLEX_PASSWORD: ${{ secrets.FLEX_PASSWORD }}
        run: python -m flex2ics --out site/work.ics

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
